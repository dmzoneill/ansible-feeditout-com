---
- name: Ensure libpam-tmpdir is installed
  apt:
    name: libpam-tmpdir
    state: present

- name: Restrict su to sudo group via pam_wheel
  lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so'
    line: 'auth       required   pam_wheel.so use_uid group=sudo'
    state: present

- name: Install libpam-pwquality for password complexity
  apt:
    name: libpam-pwquality
    state: present

- name: Configure password complexity in pwquality
  copy:
    content: |
      minlen = 12
      dcredit = -1
      ucredit = -1
      lcredit = -1
      ocredit = -1
      maxrepeat = 3
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: '0644'

- name: Configure account lockout via pam_faillock
  copy:
    content: |
      auth required pam_faillock.so preauth silent deny=5 unlock_time=900
      auth [default=die] pam_faillock.so authfail deny=5 unlock_time=900
      account required pam_faillock.so
    dest: /etc/pam.d/common-auth-faillock
    owner: root
    group: root
    mode: '0644'
