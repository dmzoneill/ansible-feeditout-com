---
- name: Deploy aggregated logrotate config
  template:
    src: logrotate-all.j2
    dest: /etc/logrotate.d/zz-ansible-managed
    owner: root
    group: root
    mode: '0644'

- name: Find all existing logrotate.d files
  find:
    paths: /etc/logrotate.d
    file_type: file
  register: existing_logrotate_files

- name: Remove old individual logrotate configs now in aggregate
  file:
    path: "{{ oldfile.path }}"
    state: absent
  loop: "{{ existing_logrotate_files.files }}"
  loop_control:
    loop_var: oldfile
  when:
    - oldfile.path | basename != 'zz-ansible-managed'
    - oldfile.path | basename in logrotate_configs | map(attribute='name') | list
