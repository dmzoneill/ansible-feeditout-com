---
- name: Ensure iptables-persistent is installed
  apt:
    name: iptables-persistent
    state: present

- name: Deploy iptables management script
  copy:
    src: manage_iptables.py
    dest: /usr/local/bin/manage_iptables.py
    mode: '0750'

- name: Render iptables rules YAML from host_vars
  copy:
    dest: /etc/ansible/iptables.yml
    content: "{{ iptables | to_nice_yaml(indent=2) }}"
    mode: '0640'

- name: Execute iptables management script
  command: /usr/bin/python3 /usr/local/bin/manage_iptables.py
  register: iptables_result
  changed_when: "'No changes' not in iptables_result.stdout"

- name: Check if Docker service exists
  stat:
    path: /usr/bin/dockerd
  register: dockerd_binary

- name: Restart Docker to restore NAT/FORWARD chains after iptables sync
  systemd:
    name: docker
    state: restarted
  when:
    - dockerd_binary.stat.exists
    - iptables_result.changed
