---
- name: Deploy /etc/environment
  ansible.builtin.template:
    src: environment.j2
    dest: /etc/environment
    owner: root
    group: root
    mode: "0644"

- name: Ensure /etc/environment.d/ directory exists
  ansible.builtin.file:
    path: /etc/environment.d
    state: directory
    owner: root
    group: root
    mode: "0755"
