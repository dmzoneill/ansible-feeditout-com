#     owner: prometheus
#     group: prometheus
#     mode: '0644'
#   when: prometheus_tls_enabled
#   notify: Restart Prometheus

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  tags: prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: yes
    state: started
  tags: prometheus
