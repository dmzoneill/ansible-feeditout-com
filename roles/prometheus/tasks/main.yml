---
- name: Ensure prometheus group exists
  ansible.builtin.group:
    name: prometheus
    state: present
  tags: prometheus

- name: Ensure prometheus user exists
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  tags: prometheus

- name: Create required directories
  ansible.builtin.file:
    path: "{{ prometheus_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /etc/prometheus/rules
    - /etc/prometheus/file_sd
  loop_control:
    loop_var: prometheus_dir
  tags: prometheus

- name: Check if Prometheus is already installed
  ansible.builtin.stat:
    path: "/opt/{{ prometheus_extracted_dir }}"
  register: prometheus_installed
  tags: prometheus

- name: Fetch Prometheus SHA256 checksums
  ansible.builtin.uri:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/sha256sums.txt"
    return_content: true
  register: prometheus_checksums
  when: not prometheus_installed.stat.exists
  tags: prometheus

- name: Extract Prometheus tarball checksum
  ansible.builtin.set_fact:
    prometheus_checksum: "sha256:{{ prometheus_checksums.content | regex_search('([a-f0-9]{64})\\s+' ~ prometheus_extracted_dir ~ '.tar.gz', '\\1') | first }}"
  when: not prometheus_installed.stat.exists
  tags: prometheus

- name: Download Prometheus tarball
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    checksum: "{{ prometheus_checksum }}"
    mode: '0644'
  register: prometheus_download
  when: not prometheus_installed.stat.exists
  tags: prometheus

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /opt
    remote_src: yes
  when: not prometheus_installed.stat.exists
  tags: prometheus

- name: Create symlink to /opt/prometheus
  ansible.builtin.file:
    src: "/opt/{{ prometheus_extracted_dir }}"
    dest: /opt/prometheus
    state: link
    force: true
  tags: prometheus

- name: Copy Prometheus binaries
  ansible.builtin.copy:
    src: "/opt/{{ prometheus_extracted_dir }}/{{ binary }}"
    dest: "/usr/local/bin/{{ binary }}"
    remote_src: yes
    mode: '0755'
  loop:
    - prometheus
    - promtool
  loop_control:
    loop_var: binary
  tags: prometheus

- name: Install systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
  notify: Restart Prometheus
  tags: prometheus

- name: Ensure Prometheus rules directory exists
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    mode: '0755'
    owner: prometheus
    group: prometheus
  tags: prometheus

- name: Deploy system alert rules for Prometheus
  ansible.builtin.template:
    src: system.yml.j2
    dest: /etc/prometheus/rules/system_alert_rules.yml
    mode: '0644'
    owner: prometheus
    group: prometheus
    validate: 'promtool check rules %s'
  notify: Restart Prometheus
  tags: prometheus

- name: Deploy systemd alert rules for Prometheus
  ansible.builtin.template:
    src: services.yml.j2
    dest: /etc/prometheus/rules/systemd_alert_rules.yml
    mode: '0644'
    owner: prometheus
    group: prometheus
    validate: 'promtool check rules %s'
  notify: Restart Prometheus
  tags: prometheus

- name: Remove dead port alert rules (used nonexistent metric)
  ansible.builtin.file:
    path: /etc/prometheus/rules/ports_alert_rules.yml
    state: absent
  notify: Restart Prometheus
  tags: prometheus

- name: Find unmanaged Prometheus rule files
  ansible.builtin.find:
    paths: /etc/prometheus/rules
    patterns: "*.yml"
    excludes:
      - system_alert_rules.yml
      - systemd_alert_rules.yml
  register: unmanaged_rules
  tags: prometheus

- name: Remove unmanaged Prometheus rule files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ unmanaged_rules.files }}"
  notify: Restart Prometheus
  tags: prometheus

# #   when: prometheus_tls_enabled
# #   notify: Restart Prometheus

- name: Ensure textfile collector directory exists for SSL metrics
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy SSL cert expiry collector script
  copy:
    src: ssl_cert_expiry.sh
    dest: /usr/local/bin/ssl_cert_expiry.sh
    mode: '0755'
    owner: root
    group: root

- name: Run SSL cert expiry collector
  command: /usr/local/bin/ssl_cert_expiry.sh
  changed_when: false

- name: Copy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: Restart Prometheus
  tags: prometheus

