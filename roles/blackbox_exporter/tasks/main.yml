---
- name: Ensure blackbox_exporter config directory exists
  file:
    path: /etc/blackbox_exporter
    state: directory
    mode: '0755'

- name: Deploy blackbox_exporter config
  copy:
    content: |
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302]
            follow_redirects: true
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: "feeditout.com"
            query_type: "A"
        tcp_connect:
          prober: tcp
          timeout: 5s
    dest: /etc/blackbox_exporter/config.yml
    mode: '0644'
  register: blackbox_config

- name: Run blackbox_exporter container
  community.docker.docker_container:
    name: blackbox_exporter
    image: prom/blackbox-exporter:v0.25.0
    restart_policy: always
    state: started
    network_mode: host
    volumes:
      - "/etc/blackbox_exporter:/config:ro"
    command: "--config.file=/config/config.yml"
