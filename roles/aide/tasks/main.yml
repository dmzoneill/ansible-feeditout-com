---
- name: Mask orphaned dailyaidecheck units (package-shipped, cannot delete)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    enabled: false
  loop:
    - dailyaidecheck.service
    - dailyaidecheck.timer
  failed_when: false

- name: Remove orphaned dailyaidecheck overrides
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/dailyaidecheck-buildcache.service
  register: aide_cleanup

- name: Reload systemd after dailyaidecheck cleanup
  ansible.builtin.systemd:
    daemon_reload: true
  when: aide_cleanup.changed

- name: Ensure AIDE is installed
  ansible.builtin.package:
    name: aide
    state: present

- name: Ensure /var/log/aide exists
  ansible.builtin.file:
    path: /var/log/aide
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Ensure aide.log permissions are valid
  ansible.builtin.file:
    path: /var/log/aide/aide.log
    state: touch
    owner: root
    group: root
    mode: '0640'
    modification_time: preserve
    access_time: preserve
