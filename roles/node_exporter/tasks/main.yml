---
- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Ensure /etc/docker directory exists
  file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Deploy Docker daemon.json with DNS servers
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["8.8.8.8", "1.1.1.1"],
        "icc": false
      }
    mode: '0644'
  register: docker_daemon_json

- name: Restart Docker if daemon.json changed
  systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when: docker_daemon_json.changed

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: true

- name: Ensure textfile collector directory exists
  file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: '0755'

- name: Run Node Exporter container with systemd collector support
  community.docker.docker_container:
    name: node_exporter
    image: prom/node-exporter:v1.8.2
    restart_policy: always
    state: started
    network_mode: host
    pid_mode: host
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
      - "/run/systemd:/run/systemd:ro"
      - "/run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro"
      - "/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro"
      - "/var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro"
    command: >
      --path.procfs=/host/proc
      --path.sysfs=/host/sys
      --path.rootfs=/rootfs
      --collector.systemd
      --collector.processes
      --collector.netstat
      --collector.textfile
      --collector.textfile.directory=/var/lib/node_exporter/textfile
