---
- name: Ensure certbot and dns-cloudflare plugin are installed
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Deploy Cloudflare credentials file
  template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: '0600'

- name: Initialize certbot tracking facts
  set_fact:
    certbot_needed: false
    certs_to_issue: []

- name: Check if cert exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain_entry.domain }}/cert.pem"
  loop: "{{ domains }}"
  loop_control:
    loop_var: domain_entry
    label: "{{ domain_entry.domain }}"
  register: cert_stat_results

- name: Extract SANs from existing certs
  command: >
    openssl x509 -in /etc/letsencrypt/live/{{ item.0.domain }}/cert.pem -noout -text
  loop: "{{ domains | zip(cert_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.domain }}"
  when: item.1.stat.exists
  changed_when: false
  failed_when: false
  register: openssl_cert_results

- name: Determine which certs need to be issued
  set_fact:
    certs_to_issue: "{{ certs_to_issue + [item.0.domain] }}"
    certbot_needed: true
  loop: "{{ domains | zip(cert_stat_results.results) | zip(openssl_cert_results.results) | map('flatten') | list }}"
  loop_control:
    label: "{{ item.0.domain }}"
  when: >
    not item.1.stat.exists or
    ('*.%s' % item.0.domain) not in (item.2.stdout | default('') | regex_findall('DNS:([^,\\s]+)'))

- name: Issue wildcard certificates via Cloudflare DNS challenge
  command: >
    certbot certonly --dns-cloudflare
    --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    --cert-name {{ cert_domain }}
    -d {{ cert_domain }} -d '*.{{ cert_domain }}'
    --agree-tos --non-interactive --register-unsafely-without-email
  loop: "{{ certs_to_issue }}"
  loop_control:
    loop_var: cert_domain
    label: "{{ cert_domain }}"
  register: certbot_result
  failed_when: certbot_result.rc != 0 and 'Certificate not yet due for renewal' not in certbot_result.stderr
  when: certbot_needed

- name: Ensure {{ certbot_helpers_dir }} exists
  file:
    path: "{{ certbot_helpers_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Copy certbot.sh
  copy:
    src: certbot.sh
    dest: "{{ certbot_helpers_dir }}/certbot.sh"
    mode: '0755'
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Copy certbot_clean_old.sh
  copy:
    src: certbot_clean_old.sh
    dest: "{{ certbot_helpers_dir }}/certbot_clean_old.sh"
    mode: '0755'
    owner: "{{ user }}"
    group: "{{ user }}"

- name: Run clean_old.sh to clean up certs
  command: "{{ certbot_helpers_dir }}/certbot_clean_old.sh"
  become: true
  changed_when: false
